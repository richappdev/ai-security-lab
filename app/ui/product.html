<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Control Plane</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <main class="page">
    <h1>Agent Security Validation</h1>
    <p>Register an org/project/agent and run deterministic scenarios via <code>/v1</code>.</p>
    <nav>
      <a href="/ui/">Overview</a> |
      <a href="/ui/jobs.html">Jobs</a> |
      <a href="/docs/product/">Product docs</a>
    </nav>
    <section>
      <label>User sub <input id="user" value="alice" /></label>
      <label>Org name <input id="orgName" value="DemoOrg" /></label>
      <button id="bootstrap">Bootstrap org + project + agent</button>
      <button id="runSuite">Run core suite</button>
      <pre id="out"></pre>
    </section>
  </main>
  <script>
    const out = document.getElementById("out");
    const headers = () => ({
      "Content-Type": "application/json",
      "X-User-Sub": document.getElementById("user").value,
    });
    let state = {};
    document.getElementById("bootstrap").onclick = async () => {
      const org = await fetch("/v1/organizations", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name: document.getElementById("orgName").value }),
      }).then((r) => r.json());
      const project = await fetch(`/v1/organizations/${org.id}/projects`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ name: "default" }),
      }).then((r) => r.json());
      const agent = await fetch(
        `/v1/organizations/${org.id}/projects/${project.id}/agents`,
        {
          method: "POST",
          headers: headers(),
          body: JSON.stringify({
            name: "synthetic",
            allowed_tools: ["read_public_doc"],
          }),
        }
      ).then((r) => r.json());
      state = { org, project, agent };
      out.textContent = JSON.stringify(state, null, 2);
    };
    document.getElementById("runSuite").onclick = async () => {
      if (!state.org) {
        out.textContent = "Bootstrap first";
        return;
      }
      const keys = [
        "unauthorized_tool_invocation",
        "direct_prompt_injection",
        "indirect_prompt_injection",
        "sensitive_data_exfiltration",
        "approval_bypass",
      ];
      const result = await fetch(`/v1/organizations/${state.org.id}/suite-runs`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          project_id: state.project.id,
          agent_id: state.agent.id,
          scenario_keys: keys,
          behave_securely: true,
        }),
      }).then((r) => r.json());
      out.textContent = JSON.stringify(result, null, 2);
    };
  </script>
</body>
</html>
