name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build application and worker images
        run: docker compose build security-app evaluation-worker

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker compose run -d --no-deps --name security-app-ci --service-ports \
            -e DATABASE_URL=sqlite+pysqlite:////tmp/ci.db \
            -e ALLOW_DEV_AUTH=true \
            -e EVIDENCE_SIGNING_KEY=ci-smoke-key \
            security-app
          for i in $(seq 1 30); do
            body="$(curl -fsS http://127.0.0.1:8000/health || true)"
            if echo "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health check passed: $body"
              exit 0
            fi
            sleep 1
          done
          echo "Health check timed out"
          docker logs security-app-ci || true
          exit 1

      - name: Run beta-exit workflow inside image
        run: |
          docker exec security-app-ci python -m certification.beta_exit \
            --base-url http://127.0.0.1:8000 \
            --dev-user docker-ci \
            --provider none

      - name: Verify worker isolation imports
        run: |
          docker run --rm \
            --user 65532:65532 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --network none \
            --cpus 1 \
            --memory 512m \
            --pids-limit 128 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint python \
            ai-security-lab-evaluation-worker \
            -c "from workers.workflows import EvaluationWorkflow, SuiteWorkflow; assert EvaluationWorkflow and SuiteWorkflow"

      - name: Stop smoke container
        if: always()
        run: |
          docker rm -f security-app-ci || true
          docker compose down --remove-orphans || true

  postgres-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PostgreSQL certification image
        run: docker compose --profile test build postgres-test
      - name: Apply migrations and verify PostgreSQL RLS in Docker
        run: |
          docker compose --profile test up \
            --abort-on-container-exit \
            --exit-code-from postgres-test \
            postgres-test
      - name: Clean up PostgreSQL certification stack
        if: always()
        run: docker compose --profile test rm --stop --force postgres-test postgres-test-db
