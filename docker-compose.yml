name: ai-security-lab

services:
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aisec}
      POSTGRES_DB: ${POSTGRES_DB:-aisec}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisec} -d ${POSTGRES_DB:-aisec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aisec_test
      POSTGRES_PASSWORD: aisec_test
      POSTGRES_DB: aisec_test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - lab_net
    profiles:
      - test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisec_test -d aisec_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["python", "-m", "certification.postgres_test"]
    environment:
      DATABASE_URL: postgresql+psycopg://aisec_test:aisec_test@postgres-test-db:5432/aisec_test
      POSTGRES_TEST_URL: postgresql+psycopg://aisec_test:aisec_test@postgres-test-db:5432/aisec_test
      DEPLOYMENT_ENV: test
      ALLOW_DEV_AUTH: "true"
    networks:
      - lab_net
    profiles:
      - test
    depends_on:
      postgres-test-db:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lab-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-port=8081", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8081
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8081"
    volumes:
      - ./deploy/keycloak/aisec-realm.json:/opt/keycloak/data/import/aisec-realm.json:ro
    networks:
      - lab_net
    profiles:
      - oidc

  minio:
    image: minio/minio:latest
    container_name: lab-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - lab_net
    profiles:
      - beta
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lab-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-evidence};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
    networks:
      - lab_net
    profiles:
      - beta

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: lab-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aisec}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-aisec}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "${TEMPORAL_BIND:-127.0.0.1}:${TEMPORAL_PORT:-7233}:7233"
    networks:
      - lab_net
    profiles:
      - beta

  security-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: lab-security-app
    restart: unless-stopped
    environment:
      APP_REPO_ROOT: /workspace
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aisec:aisec@postgres:5432/aisec}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-aisec-ui}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-local}
      USE_DURABLE_RUNS: ${USE_DURABLE_RUNS:-true}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agent-security-evaluations}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_CLIENT_CERT: ${TEMPORAL_CLIENT_CERT:-}
      TEMPORAL_CLIENT_KEY: ${TEMPORAL_CLIENT_KEY:-}
      TEMPORAL_SERVER_ROOT_CA: ${TEMPORAL_SERVER_ROOT_CA:-}
      TEMPORAL_TLS_DOMAIN: ${TEMPORAL_TLS_DOMAIN:-}
      ALLOW_LEGACY_SYNC_RUNS: ${ALLOW_LEGACY_SYNC_RUNS:-true}
      EVIDENCE_SIGNING_KEY: ${EVIDENCE_SIGNING_KEY:-local-dev-evidence-key}
      EVIDENCE_SIGNING_ALGORITHM: ${EVIDENCE_SIGNING_ALGORITHM:-hmac-sha256}
      EVIDENCE_ED25519_PRIVATE_KEY: ${EVIDENCE_ED25519_PRIVATE_KEY:-}
      EVIDENCE_SIGNING_KEY_ID: ${EVIDENCE_SIGNING_KEY_ID:-}
      CAPABILITY_ED25519_PRIVATE_KEY: ${CAPABILITY_ED25519_PRIVATE_KEY:-}
      CAPABILITY_SIGNING_KEY_ID: ${CAPABILITY_SIGNING_KEY_ID:-}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OPERATIONS_TOKEN: ${OPERATIONS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CI_INTEGRATION_PROVIDER: ${CI_INTEGRATION_PROVIDER:-none}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      EVIDENCE_LOCAL_ROOT: /workspace/tmp/evidence
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
    ports:
      - "${SECURITY_APP_BIND:-127.0.0.1}:${SECURITY_APP_PORT:-8000}:8000"
    networks:
      - lab_net
    depends_on:
      postgres:
        condition: service_healthy
      juice-shop:
        condition: service_started
      dvwa:
        condition: service_started

  evaluation-worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: ["python", "-m", "workers.main"]
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-agent-security-evaluations}
      TEMPORAL_TLS: ${TEMPORAL_TLS:-false}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_CLIENT_CERT: ${TEMPORAL_CLIENT_CERT:-}
      TEMPORAL_CLIENT_KEY: ${TEMPORAL_CLIENT_KEY:-}
      TEMPORAL_SERVER_ROOT_CA: ${TEMPORAL_SERVER_ROOT_CA:-}
      TEMPORAL_TLS_DOMAIN: ${TEMPORAL_TLS_DOMAIN:-}
    networks:
      - lab_net
    profiles:
      - beta
    depends_on:
      - temporal

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: lab-juice-shop
    restart: unless-stopped
    ports:
      - "${JUICE_SHOP_BIND:-127.0.0.1}:${JUICE_SHOP_PORT:-3000}:3000"
    networks:
      lab_net:
        aliases:
          - juice-shop.local

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: lab-dvwa
    restart: unless-stopped
    ports:
      - "${DVWA_BIND:-127.0.0.1}:${DVWA_PORT:-8080}:80"
    networks:
      lab_net:
        aliases:
          - dvwa.local

networks:
  lab_net:
    name: ai-security-lab-net
    driver: bridge

volumes:
  postgres_data:
  minio_data:
